name: Regenerate Plots Only (From Existing Statistics)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/plot_results.py'
      - '.github/workflows/plot-only.yml'

permissions:
  contents: write

concurrency:
  group: plot-regeneration
  cancel-in-progress: true

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Matplotlib and NumPy
        run: |
          pip install --quiet numpy matplotlib

      - name: Purge Stale 5-Seed 64-Entry Files and Regenerate Clean Results
        run: |
          python3 -c '
          import glob, os
          keep = {
              "_p_64nbr_cooja_stats_.txt", "_p_64nbr_stats_.txt",
              "_s_64nbr_cooja_stats_.txt", "_s_64nbr_stats_.txt",
              "_ebmc_2s_64nbr_cooja_stats_.txt", "_ebmc_2s_64nbr_stats_.txt",
          }
          removed = []
          for fp in sorted(glob.glob("Statistics/*_64nbr_*stats_.txt")):
              if os.path.basename(fp) not in keep:
                  os.remove(fp)
                  removed.append(fp)
          print(f"Removed {len(removed)} stale 5-seed 64nbr files from Statistics/")
          '
          python3 scripts/plot_results.py

      - name: Upload Updated Plots & Tables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPDATED-PLOTS-AND-RESULTS
          path: |
            Plots/
            Results/

      - name: Auto-Commit Clean Statistics, Tables, and Plots
        run: |
          rm -rf tmp_artifacts /tmp/new_results
          mkdir -p /tmp/new_results
          cp -a Statistics Plots Results /tmp/new_results/ 2>/dev/null || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B main origin/main
          git clean -fd

          rm -rf Statistics Plots Results
          rm -f ./*.png
          cp -a /tmp/new_results/* . 2>/dev/null || true
          rm -rf /tmp/new_results

          git ls-files '*.png' | awk 'index($0,"/")==0' | xargs -r git rm -f --
          git add -A Statistics/ Plots/ Results/
          git diff --staged --quiet || (git commit -m "Remove root PNGs and keep clean 30-seed plots and tables in Plots/ and Results/" && git push origin main)